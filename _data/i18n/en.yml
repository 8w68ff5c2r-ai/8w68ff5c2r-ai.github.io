faq:
  title: "FAQ"
  items:
    - q: "Who are the witnesses?"
      a: "Stefan, Katha and Regina. Their numbers are on the invitation – or just ask us."
    - q: "Why does the wedding have to be in Swabia?"
      a: "So Josef can spend the rest of his life hearing how Magdalena didn't just have to move to Swabia – she had to get married there too."
    - q: "Dress code?"
      a: "Despite what you might have heard, you don't need Tracht (traditional Bavarian dress) to come along. Wear whatever you like – just don't turn up looking like you've been dragged through a hedge backwards."
    - q: "Where can I stay?"
      a: "Dinnae worry about where to sleep. Just pick “Accommodation needed” on the RSVP form. We're sorting it out for everyone and we'll be in touch."
    - q: "Do I have to be Catholic to set foot in the church?"
      a: "You'll find out soon enough. If you burst into flames on the doorstep, that's a no."
    - q: "What's on the menu?"
      a: "A starter and a main course – the rest is still a surprise. After the church, there'll be something hearty to keep you going."
    - q: "How does the accommodation work?"
      a: "There are two places to stay right in Langerringen: a hotel that hasn't opened yet, and three holiday flats. We've spoken to both, and there's plenty of room for everyone. Just tell us if you'd like to stay over and we'll organise it all – nae bother. Right now there's a minimum stay of two nights. If you're coming from far away and arriving on the Friday night, we're planning a cosy wee get-together."

