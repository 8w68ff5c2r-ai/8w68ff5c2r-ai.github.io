datenschutz:
  heading: "Privacy policy"
  body: |
    <h2>1. Data controllers</h2>

    <p>
    The persons responsible for processing personal data on this website are:
    </p>

    <p>
    Magdalena Starkmann<br>
    Josef Starkmann<br>
    81539 München<br>
    Email: 8w68ff5c2r@privaterelay.appleid.com
    </p>

    <h2>2. General information</h2>

    <p>
    Protecting your personal data matters to us.
    Personal data is processed solely in accordance with the applicable data protection laws, in particular the General Data Protection Regulation (GDPR).
    </p>

    <h2>3. Website hosting</h2>

    <p>
    This website is hosted on GitHub Pages. When you visit the website, technically necessary data may be processed, in particular:
    </p>

    <ul>
    <li>IP address</li>
    <li>date and time of access</li>
    <li>browser type and version</li>
    <li>operating system</li>
    <li>pages visited</li>
    </ul>

    <p>
    This data is processed in order to provide the website and deliver it securely.
    </p>

    <p>
    Further information:
    <a href="https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement" target="_blank" rel="noopener noreferrer">GitHub Privacy Statement</a>
    </p>

    <h2>4. Language settings</h2>

    <p>
    When you first open the homepage, the website selects a language based on your browser's time zone and language settings. This happens entirely within your browser; no data is sent to us or to third parties.
    </p>

    <p>
    If you choose a language using the flags, your choice is saved in your browser's local storage so that the website appears in that language on your next visit. This information never leaves your browser and can be deleted at any time via your browser settings.
    The legal basis is Section 25(2) no. 2 TDDDG (German Telecommunications Digital Services Data Protection Act; storage strictly necessary for a service you have requested).
    </p>

    <h2>5. RSVP form</h2>

    <p>
    Personal data may be submitted via the RSVP form. This includes in particular:
    </p>

    <ul>
    <li>first name and surname</li>
    <li>whether you will attend</li>
    <li>number of adults and children</li>
    <li>accommodation requests</li>
    <li>allergies or food intolerances</li>
    <li>optional messages</li>
    </ul>

    <p>
    This data is processed solely for planning and holding our wedding celebration.
    </p>

    <p>
    The legal basis is Art. 6(1)(a) GDPR (consent).
    </p>

    <h2>6. Processing by Formspree</h2>

    <p>
    We use the Formspree service to transmit the form data.
    The data you enter is sent to Formspree and processed there in order to deliver the form submission.
    </p>

    <p>
    Further information:
    <a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noopener noreferrer">Formspree Privacy Policy</a>
    </p>

    <h2>7. Storage period</h2>

    <p>
    Data submitted via the form is stored only for as long as is necessary to plan, organise and hold the wedding.
    Once it is no longer needed for that purpose, the data is deleted.
    </p>

    <h2>8. Recipients of personal data</h2>

    <p>
    The following service providers may be used to provide and process the website:
    </p>

    <ul>
    <li>GitHub Pages (hosting)</li>
    <li>Formspree (form processing)</li>
    </ul>

    <h2>9. Your rights</h2>

    <p>
    You have the right to:
    </p>

    <ul>
    <li>obtain information about the data stored about you</li>
    <li>have inaccurate data corrected</li>
    <li>have your data erased</li>
    <li>request restriction of processing</li>
    <li>withdraw your consent at any time with effect for the future</li>
    </ul>

    <p>
    To exercise these rights, simply send an informal message to the data controllers named above.
    </p>

    <h2>10. Right to lodge a complaint</h2>

    <p>
    You have the right to lodge a complaint with a data protection supervisory authority about the processing of your personal data.
    </p>

    <h2>11. Changes to this privacy policy</h2>

    <p>
    We reserve the right to update this privacy policy if legal or technical changes make this necessary.
    </p>

    <p>
    Last updated: November 2026
    </p>
