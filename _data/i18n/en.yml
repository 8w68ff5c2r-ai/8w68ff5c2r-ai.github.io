faq:
  title: "FAQ"
  items:
    - q: "Who are the witnesses?"
      a: "Stefan, Katha and Regina. You'll find their phone numbers on the invitation, or just ask us."
    - q: "Why does the wedding have to be in Swabia?"
      a: "So that Josef can spend the rest of his life hearing about how Magdalena not only had to move to Swabia, but had to get married there too."
    - q: "Dress code?"
      a: "Contrary to popular belief, you are more than welcome to come to our wedding without wearing Tracht (traditional Bavarian dress). Wear whatever you like – just don't turn up looking too scruffy!"
    - q: "Where can I stay?"
      a: "Please tick “Accommodation needed” on the RSVP form. We're trying to coordinate it for everyone and will get back to you!"
    - q: "Do I have to be Catholic to set foot in the church?"
      a: "You'll find out if you burst into flames the moment you step inside."
    - q: "What's on the menu?"
      a: "A starter and a main course – the rest is still a surprise. After the church, there'll be a hearty bite to eat."
    - q: "How does the accommodation work for me?"
      a: "There are two places to stay right in Langerringen: a hotel that hasn't opened yet, and three holiday flats. We've already been in touch with both, and there's plenty of room for everyone. Just let us know whether you'd like to stay overnight and we'll sort it out centrally. The accommodation currently has a minimum stay of two nights. For those travelling from further afield who arrive on Friday night, we're planning a small, cosy get-together."

