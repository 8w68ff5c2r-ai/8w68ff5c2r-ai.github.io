faq:
  title: "Preguntas frecuentes"
  items:
    - q: "¿Quiénes son los testigos?"
      a: "Stefan, Katha y Regina. Tenéis sus números de teléfono en la invitación; si no, preguntadnos."
    - q: "¿Por qué tiene que ser la boda en Suabia?"
      a: "Para que Josef tenga que oír durante el resto de su vida que Magdalena no solo tuvo que mudarse a Suabia, sino que encima tuvo que casarse allí."
    - q: "¿Hay código de vestimenta?"
      a: "Contra lo que mucha gente cree, se puede venir a nuestra boda sin el traje tradicional bávaro (Tracht). Poneos lo que queráis, ¡siempre que no vengáis hechos un desastre!"
    - q: "¿Dónde puedo alojarme?"
      a: "Marcad en el formulario de confirmación que necesitáis alojamiento. Intentaremos organizarlo de forma coordinada y os diremos algo."
    - q: "¿Hay que ser católico para entrar en la iglesia?"
      a: "Lo sabréis si empezáis a arder en cuanto piséis la iglesia."
    - q: "¿Qué hay de comer?"
      a: "Entrante y plato principal; el resto, de momento, es sorpresa. Después de la iglesia habrá algo contundente para picar."
    - q: "¿Cómo funciona lo del alojamiento?"
      a: "Hay dos opciones para dormir en el mismo Langerringen: un hotel que todavía no ha abierto y tres apartamentos vacacionales. Ya hemos consultado con ambos y hay sitio de sobra para todos. Decidnos si os vais a quedar a dormir y nosotros nos encargamos de organizarlo. Ahora mismo, los alojamientos exigen una estancia mínima de dos noches. Para quienes vengan de lejos y lleguen ya la noche del viernes, estamos preparando un pequeño encuentro informal."

