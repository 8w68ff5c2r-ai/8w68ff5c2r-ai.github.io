faq:
  title: "FAQ"
  items:
    - q: "Wer sind die Trauzeugen?"
      a: "Stefan, Katha und Regina, Telefonnummern auf der Einladung oder auf Nachfrage."
    - q: "Warum muss die Hochzeit in Schwaben stattfinden?"
      a: "Damit sich Josef bis ans Ende seines Lebens anhören kann, dass Magdalena nicht nur nach Schwaben ziehen muss, sondern auch dort heiraten musste."
    - q: "Dresscode?"
      a: "Entgegen populärer Annahmen ist es durchaus möglich, unsere Hochzeit nicht in Tracht zu besuchen - Ziehts an was ihr wollts, solangs net zu g’schlampert is!"
    - q: "Wo kann ich übernachten?"
      a: "Bitte kreuzt bei der Anmeldung an dass ihr eine Übernachtungsgelegenheit braucht - wir versuchen uns koordiniert darum zu kümmern und melden uns!"
    - q: "Muss ich katholisch sein, um die Kirche zu betreten?"
      a: "Das merkt ihr wenn ihr in Flammen aufgeht, sobald ihr den Kirchenboden betretet."
    - q: "Was gibt es zu essen?"
      a: "Vorspeise und Hauptspeise. Der Rest bleibt noch eine Überraschung. Nach der Kirche ist eine deftige Kleinigkeit geplant."
    - q: "Wie funktioniert das für mich mit der Übernachtung ?"
      a: "Es gibt zwei Übernachtungsmöglichkeiten direkt in Langerringen - ein Hotel, dass noch nicht eröffnet hat und 3 Ferienwohnungen. Wir haben bei beiden schon angefragt und es gibt genügend Kapazitäten für alle. Gebt uns bitte Bescheid, ob ihr übernachtet und wir kümmern uns zentral. Die aktuelle Unterkünfte haben eine Mindestaufenthaltsdauer von 2 Nächten. Wir planen aktuell für die weit angereisten, die schon von Freitag auf Samstag übernachten ein kleines gemütliches Beisammensein."

